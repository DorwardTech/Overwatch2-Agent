# Overwatch site agent — LEGACY (P&C Micros "Nexus") deployment for one venue.
#
#   cp .env.example .env      # set CENTRAL_API_URL, AGENT_TOKEN, and the
#                             # AGENT_MODE=legacy / NEXUS_DSN / LASERTAG_URL block
#   docker compose -f docker-compose.legacy.yml up -d
#
# The agent reads finished games from the Nexus MySQL database (read-only) and
# live pack state from the on-box "lasertag" management app, translating both
# into the same payloads the O-Zone agent sends. See LEGACY.md.
services:
  agent:
    build: .
    # image: ghcr.io/OWNER/overwatch-agent:latest
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_MODE: legacy
      HEALTH_ADDR: ':8088'
    # Lets the container reach the Nexus DB / lasertag app on the Docker host via
    # host.docker.internal (use the LAN IP instead if they're remote).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', '/agent', 'healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
