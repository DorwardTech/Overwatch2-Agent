name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    name: Lint, vet, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      # The agent enforces the never-touch-the-print-server-during-a-game
      # invariant in its test suite, so the tests MUST run here, with the race
      # detector — not just vet/build.
      - name: gofmt, vet, test (race) & build
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
          go build ./...

      # The Windows service code sits behind a build tag, so a Linux build never
      # compiles it: vet and build for Windows too (what windows-release.yml
      # ships), or it rots unseen.
      - name: Cross-compile for Windows
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...

      # The legacy Nexus integration tests (build tag `integration`) run the real
      # SQL against a database seeded from production dumps, which are not part of
      # this public mirror. They self-skip without NEXUS_TEST_DSN; here we only
      # confirm they still compile so the build tag doesn't rot.
      - name: Build integration-tagged tests
        run: go build -tags=integration ./...

  # windows-release.yml only builds the installer on a v* tag, so without this
  # a broken installer script would not surface until a release was being cut.
  # It proves the script compiles against the same payload layout the release
  # job stages; what it produces is thrown away.
  installer:
    name: Build Windows installer (check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Stage a payload
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
        run: |
          foreach ($arch in 'amd64', 'arm64') {
            $env:GOARCH = $arch
            go build -o "stage/$arch/overwatch-agent.exe" ./cmd/agent
            if ($LASTEXITCODE -ne 0) { throw "build failed for $arch" }
          }
          Copy-Item cmd/agent/agent.env.example, WINDOWS.md, CHANGELOG.md, LICENSE stage/amd64/

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Compile the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=0.0.0" `
            "/DAmd64Dir=stage\amd64" `
            "/DArm64Dir=stage\arm64" `
            "/DOutDir=out" `
            "packaging\windows\overwatch-agent.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build agent image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
