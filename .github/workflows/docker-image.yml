name: build agent image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Architectures the released image is published for. amd64 for x86 hosts, arm64
# for modern ARM (Raspberry Pi 3/4/5 64-bit, ARM servers), armv7 for older 32-bit
# ARM boards.
env:
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # A release tag must be exactly vMAJOR.MINOR.PATCH. Anything else still
      # matches 'v*' above: a mistyped "v.1.6.5" once went on to publish a
      # mis-stamped image. Stop before anything is built or pushed. Branch
      # pushes and manual runs on a branch skip this.
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Not a release tag::Tag '$TAG' must be vMAJOR.MINOR.PATCH (for example v1.2.3). Nothing was built or pushed; delete the tag and push the right one."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Multi-arch needs buildx. QEMU is NOT required: the Go build stage runs on
      # the native runner ($BUILDPLATFORM) and cross-compiles, and the final
      # distroless stage only copies the static binary (no target-arch RUN).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (compile check, all platforms)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/dorwardtech/overwatch2-agent (lowercased automatically).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the binary's reported version: the git tag's semver on a
          # tagged release, otherwise the Dockerfile's release default.
          build-args: |
            AGENT_VERSION=${{ startsWith(github.ref, 'refs/tags/') && steps.meta.outputs.version || '1.9.1' }}
          # Keep the manifest list clean (one entry per arch, no "unknown/unknown"
          # provenance entries that confuse some ARM runtimes / imagetools).
          provenance: false
